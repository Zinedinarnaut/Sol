name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  swift-tests:
    name: Swift tests
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Audit public source
        run: ./script/audit_public_source.sh

      - name: Run tests
        run: swift test
