name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-release:
    name: Validate release
    runs-on: macos-26
    timeout-minutes: 25
    outputs:
      version: ${{ steps.release.outputs.version }}
      notes: ${{ steps.release.outputs.notes }}

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate tag and release notes
        id: release
        shell: bash
        run: |
          set -euo pipefail

          tag="$GITHUB_REF_NAME"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]; then
            echo "Release tag must look like v0.1.0 or v0.1.0-beta.1." >&2
            exit 2
          fi

          version="${tag#v}"
          project_version="$(
            sed -nE \
              's/^[[:space:]]*MARKETING_VERSION:[[:space:]]*"([^"]+)".*$/\1/p' \
              project.yml |
              head -n 1
          )"
          if [[ "$version" != "$project_version" ]]; then
            echo "Tag $tag does not match MARKETING_VERSION $project_version." >&2
            exit 2
          fi

          notes="Docs/Releases/$version.md"
          if [[ ! -s "$notes" ]]; then
            echo "Missing release notes at $notes." >&2
            exit 2
          fi

          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "Release tags must point to a commit on main." >&2
            exit 2
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "notes=$notes" >> "$GITHUB_OUTPUT"

      - name: Audit public source
        run: ./script/audit_public_source.sh

      - name: Run tests
        run: swift test

  dmg-release:
    name: Build and attach ad-hoc DMG
    # Sol supports macOS 15 minimum, so build the shippable DMG on macos-15 —
    # this also gates the floor-OS build.
    runs-on: macos-15
    needs: validate-release
    timeout-minutes: 45

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7

      # No Apple Developer identity: the DMG is ad-hoc signed so users can run
      # it via System Settings -> Privacy & Security -> "Open Anyway", or with
      # the bundled dmg-signing.sh script.
      - name: Build ad-hoc DMG
        env:
          SOL_APPLE_SIGNING: "off"
        run: ./script/build_dmg.sh

      - name: Verify DMG
        run: ./script/test_dmg_release.sh dist/Sol-*.dmg

      - name: Publish complete developer preview
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: ${{ needs.validate-release.outputs.notes }}
          RELEASE_VERSION: ${{ needs.validate-release.outputs.version }}
        run: |
          set -euo pipefail

          title="Sol $RELEASE_VERSION — Developer Preview"
          assets=(dist/Sol-*.dmg dist/Sol-*.dmg.sha256 script/dmg-signing.sh)
          if gh release view "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$title" \
              --notes-file "$RELEASE_NOTES" \
              --prerelease
            gh release upload "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber "${assets[@]}"
          else
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "$title" \
              --notes-file "$RELEASE_NOTES" \
              --prerelease \
              "${assets[@]}"
          fi
