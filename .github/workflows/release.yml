name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-release:
    name: Publish source prerelease
    runs-on: macos-26
    timeout-minutes: 25

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate tag and release notes
        id: release
        shell: bash
        run: |
          set -euo pipefail

          tag="$GITHUB_REF_NAME"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]; then
            echo "Release tag must look like v0.1.0 or v0.1.0-beta.1." >&2
            exit 2
          fi

          version="${tag#v}"
          project_version="$(
            sed -nE \
              's/^[[:space:]]*MARKETING_VERSION:[[:space:]]*"([^"]+)".*$/\1/p' \
              project.yml |
              head -n 1
          )"
          if [[ "$version" != "$project_version" ]]; then
            echo "Tag $tag does not match MARKETING_VERSION $project_version." >&2
            exit 2
          fi

          notes="Docs/Releases/$version.md"
          if [[ ! -s "$notes" ]]; then
            echo "Missing release notes at $notes." >&2
            exit 2
          fi

          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "Release tags must point to a commit on main." >&2
            exit 2
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "notes=$notes" >> "$GITHUB_OUTPUT"

      - name: Audit public source
        run: ./script/audit_public_source.sh

      - name: Run tests
        run: swift test

      - name: Publish or update GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: ${{ steps.release.outputs.notes }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          title="Sol $RELEASE_VERSION — Developer Preview"
          if gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$title" \
              --notes-file "$RELEASE_NOTES" \
              --prerelease
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "$title" \
              --notes-file "$RELEASE_NOTES" \
              --prerelease
          fi
